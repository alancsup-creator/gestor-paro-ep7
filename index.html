        .container { max-width: 600px; margin: 0 auto; }

        header p { font-size: 14px; opacity: 0.9; }

        .form-group { display: flex; flex-direction: column; margin-bottom: 10px; }
        .form-group label { font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #4b5563; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
        
        .btn { background: var(--primary-light); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn:hover { background: var(--primary); }
        .btn-sec { background: #10b981; margin-top: 5px; }
        .btn-sec:hover { background: #059669; }
        .btn-warning { background: #f59e0b; color: #fff; }
        .btn-warning:hover { background: #d97706; }
        .btn-danger { background: #6b7280; color: #fff; }
        .btn-danger:hover { background: #4b5563; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .stat-box { background: #eff6ff; border-left: 4px solid var(--primary-light); padding: 10px; border-radius: 8px; text-align: center; }
        .stat-box .num { font-size: 18px; font-weight: bold; color: var(--primary); }
        .stat-box .cant { font-size: 11px; color: #3b82f6; font-weight: bold; margin-top: 2px; }
        .stat-box .label { font-size: 11px; color: #6b7280; margin-top: 2px; }
        
        .turno-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: 1px solid var(--primary-light); background: transparent; color: var(--primary-light); border-radius: 8px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: var(--primary-light); color: white; }
        
        .grupo-cargo-header { background: #e5e7eb; color: #374151; font-weight: bold; font-size: 12px; padding: 6px 10px; border-radius: 6px; margin-top: 15px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .docente-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #f3f4f6; gap: 10px; }

</head>

    function inicializarDia() {
        const fecha = document.getElementById('fechaParo').value;
        if (!fecha) return alert("Por favor, selecciona una fecha.");

        const partesFecha = fecha.split('-');
        const objetoFecha = new Date(partesFecha[0], partesFecha[1] - 1, partesFecha[2]);
        const numeroDiaSemana = objetoFecha.getDay();

        // Si había una escucha previa de otra fecha, la cancelamos
        if (unsubscribeFirestore) unsubscribeFirestore();

        // Escuchar en tiempo real los cambios del documento correspondiente a esta fecha
        unsubscribeFirestore = db.collection("registros_paros").doc(fecha).onSnapshot((doc) => {
            if (doc.exists) {
                // Si la fecha ya tiene datos guardados en Firestore
                registrosBase[fecha] = doc.data().docentes;
            } else {
                // Si es un día nuevo en la nube, se mapea la base local
                registrosBase[fecha] = baseDocentes.map(docente => {
                    const leCorrespondeIr = docente.dias ? docente.dias.includes(numeroDiaSemana) : false;
                    return {
                        id: docente.id,
                        nombre: docente.nombre, 
                        escuela: docente.escuela,
                        turno: docente.turno, 
                        cargo: docente.cargo || "Sin Especificar", 
                        leToca: leCorrespondeIr,
                        estado: "Sin responder"
                    };
                });

            document.getElementById('cardResultados').style.display = 'block';
            document.getElementById('cardPlanilla').style.display = 'block';
            
            renderDocentes();
            calcularPorcentajes();
        }, (error) => {
            console.error("Error al conectar con Firebase:", error);
            alert("Error al cargar datos desde la nube. Revisa las credenciales de Firebase.");
        });
    }

    function renderDocentes() {
        const fecha = document.getElementById('fechaParo').value;
        const listaContainer = document.getElementById('listaDocentes');
        listaContainer.innerHTML = '';

        if (!registrosBase[fecha]) return;

        const docentesFiltrados = registrosBase[fecha].filter(d => d.turno === turnoActivo);

        if(docentesFiltrados.length === 0) {
            listaContainer.innerHTML = '<p style="text-align:center; padding:10px; color:#6b7280;">No hay agentes cargados en este turno.</p>';
            return;
        }

        const grupos = docentesFiltrados.reduce((acc, docente) => {
            const cargo = docente.cargo || "Sin Especificar";
            if (!acc[cargo]) acc[cargo] = [];
            acc[cargo].push(docente);
            return acc;
        }, {});

        for (const cargo in grupos) {
            const headerGrupo = document.createElement('div');
            headerGrupo.className = 'grupo-cargo-header';
            headerGrupo.innerText = `${cargo} (${grupos[cargo].length})`;
            listaContainer.appendChild(headerGrupo);

            grupos[cargo].forEach(docente => {
                const row = document.createElement('div');
                row.className = 'docente-row';
                
                if (docente.estado === undefined) {
                    docente.estado = docente.adhiere ? "Adhiere" : "No adhiere";
                    delete docente.adhiere;
                }

                row.innerHTML = `
                    <div class="docente-info">
                        <div class="docente-name" title="${docente.nombre}">${docente.nombre}</div>
                        <div class="docente-sc">${docente.escuela} - ${docente.cargo}</div>
                    </div>
                    <div class="checks-container">
                        <div class="check-item">
                            <label>¿Le toca?</label>
                            <input type="checkbox" id="toca_${docente.id}" ${docente.leToca ? 'checked' : ''} onchange="actualizarLeToca(${docente.id}, this.checked)">
                        </div>
                        <div class="select-item" id="container_estado_${docente.id}" style="${docente.leToca ? '' : 'display:none;'}">
                            <label>Postura</label>
                            <select id="estado_${docente.id}" onchange="actualizarEstado(${docente.id}, this.value)">
                                <option value="Sin responder" ${docente.estado === 'Sin responder' ? 'selected' : ''}>⏳ No contestó aún</option>
                                <option value="Adhiere" ${docente.estado === 'Adhiere' ? 'selected' : ''}>✊ Adhiere</option>
                                <option value="No adhiere" ${docente.estado === 'No adhiere' ? 'selected' : ''}>✅ No adhiere</option>
                            </select>
                        </div>
                    </div>
                `;
                listaContainer.appendChild(row);
            });
        }
    }

    function actualizarLeToca(id, valor) {
        const fecha = document.getElementById('fechaParo').value;
        const docente = registrosBase[fecha].find(d => d.id === id);
        if (docente) {
            docente.leToca = valor;
            
            if (!valor) {
                docente.estado = "Sin responder";
            }
            
            const containerEstado = document.getElementById(`container_estado_${id}`);
            if (containerEstado) {
                containerEstado.style.display = valor ? '' : 'none';
                const selectEstado = document.getElementById(`estado_${id}`);
                if (selectEstado) selectEstado.value = "Sin responder";
            }
            
            calcularPorcentajes();
        }
    }

    function actualizarEstado(id, valor) {
        const fecha = document.getElementById('fechaParo').value;
        const docente = registrosBase[fecha].find(d => d.id === id);
        if (docente) {
            docente.estado = valor;
            calcularPorcentajes();
        }
    }

    function marcarAsistenciaObligatoria() {
        const fecha = document.getElementById('fechaParo').value;
        if (!fecha || !registrosBase[fecha]) return;

        registrosBase[fecha].forEach(docente => {
            if (docente.turno === turnoActivo) {
                docente.leToca = true;
            }
        });

        renderDocentes();
        calcularPorcentajes();
    }

    function desmarcarAsistenciaTurno() {
        const fecha = document.getElementById('fechaParo').value;
        if (!fecha || !registrosBase[fecha]) return;

        registrosBase[fecha].forEach(docente => {
            if (docente.turno === turnoActivo) {
                docente.leToca = false;
                docente.estado = "Sin responder"; 
            }
        });

        renderDocentes();
        calcularPorcentajes();
    }

    function calcularPorcentajes() {
        const fecha = document.getElementById('fechaParo').value;
        if (!fecha || !registrosBase[fecha]) return;
        const diaData = registrosBase[fecha];

        const activosMañana = diaData.filter(d => d.turno === 'Mañana' && d.leToca === true);
        const activosTarde = diaData.filter(d => d.turno === 'Tarde' && d.leToca === true);

        // --- TURNO MAÑANA ---
        const docentesM = activosMañana.filter(d => d.cargo !== 'Auxiliar' && !d.nombre.includes('[Auxiliar]'));
        const adhDocentesM = docentesM.filter(d => d.estado === 'Adhiere').length;
        const pctDocM = docentesM.length > 0 ? Math.round((adhDocentesM / docentesM.length) * 100) : 0;
        document.getElementById('pctManana').innerText = `${pctDocM}%`;
        document.getElementById('cantManana').innerText = `(${adhDocentesM} de ${docentesM.length} activos)`;

        const auxiliaresM = activosMañana.filter(d => d.cargo === 'Auxiliar' || d.nombre.includes('[Auxiliar]'));
        const adhAuxM = auxiliaresM.filter(d => d.estado === 'Adhiere').length;
        const pctAuxM = auxiliaresM.length > 0 ? Math.round((adhAuxM / auxiliaresM.length) * 100) : 0;
        document.getElementById('pctAuxManana').innerText = `${pctAuxM}%`;
        document.getElementById('cantAuxManana').innerText = `(${adhAuxM} de ${auxiliaresM.length} activos)`;

        // --- TURNO TARDE ---
        const docentesT = activosTarde.filter(d => d.cargo !== 'Auxiliar' && !d.nombre.includes('[Auxiliar]'));
        const adhDocentesT = docentesT.filter(d => d.estado === 'Adhiere').length;
        const pctDocT = docentesT.length > 0 ? Math.round((adhDocentesT / docentesT.length) * 100) : 0;
        document.getElementById('pctTarde').innerText = `${pctDocT}%`;
        document.getElementById('cantTarde').innerText = `(${adhDocentesT} de ${docentesT.length} activos)`;

        const auxiliaresT = activosTarde.filter(d => d.cargo === 'Auxiliar' || d.nombre.includes('[Auxiliar]'));
        const adhAuxT = auxiliaresT.filter(d => d.estado === 'Adhiere').length;
        const pctAuxT = auxiliaresT.length > 0 ? Math.round((adhAuxT / auxiliaresT.length) * 100) : 0;
        document.getElementById('pctAuxTarde').innerText = `${pctAuxT}%`;
        document.getElementById('cantAuxTarde').innerText = `(${adhAuxT} de ${auxiliaresT.length} activos)`;
    }

    function cambiarTurno(turno) {
        turnoActivo = turno;
        document.getElementById('btnM').classList.toggle('active', turno === 'Mañana');
        document.getElementById('btnT').classList.toggle('active', turno === 'Tarde');
        renderDocentes();
    }

    // Guarda el registro del día actual en Firestore
    function guardarAsistenciaDia() {
        const fecha = document.getElementById('fechaParo').value;
        if (!fecha || !registrosBase[fecha]) return alert("No hay información cargada para guardar.");

        db.collection("registros_paros").doc(fecha).set({
            docentes: registrosBase[fecha],
            ultimaModificacion: firebase.firestore.FieldValue.serverTimestamp()
        })
        .then(() => {
            alert("¡Registro guardado y sincronizado en la nube con éxito!");
        })
        .catch((error) => {
            alert("Error al guardar en Firebase: " + error.message);
        });
    }

    function exportarExcelDia() {
        const fecha = document.getElementById('fechaParo').value;
        if (!registrosBase[fecha]) return alert("No hay datos cargados en esta fecha para exportar.");

        const diaData = registrosBase[fecha];
        
        let csvContent = "\uFEFFFecha;Tipo;Cargo;Nombre;Escuela;Turno;¿Le tocaba?;Postura / Adhesión;Estado Final\n";

        diaData.forEach(d => {
            const esAuxiliar = d.cargo === "Auxiliar" || d.nombre.includes('[Auxiliar]');
            const tipo = esAuxiliar ? "Auxiliar" : "Docente";
            const nombreLimpio = d.nombre.replace('[Auxiliar] ', '');
            
            let estadoFinal = "No le correspondía asistir";
            let postura = "N/C";
            
            if (d.leToca) {
                postura = d.estado || "Sin responder";
                if (postura === "Adhiere") {
                    estadoFinal = "Adhiere a Medida de Fuerza";
                } else if (postura === "No adhiere") {
                    estadoFinal = "Asistencia Normal / No Adhiere";
                } else {
                    estadoFinal = "Pendiente de confirmación";
                }
            }

            csvContent += `${fecha};${tipo};${d.cargo};"${nombreLimpio}";${d.escuela};${d.turno};${d.leToca ? 'SÍ' : 'NO'};${postura};${estadoFinal}\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Reporte_Nominal_Paro_${fecha}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
